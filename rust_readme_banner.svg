<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141618"/>
      <stop offset="50%" stop-color="#1b1e22"/>
      <stop offset="100%" stop-color="#0e1011"/>
    </linearGradient>
    <linearGradient id="rustGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5733"/>
      <stop offset="50%" stop-color="#CD412B"/>
      <stop offset="100%" stop-color="#8B1E12"/>
    </linearGradient>
    <linearGradient id="hazardPattern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CD412B"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3036"/>
      <stop offset="100%" stop-color="#1a1c20"/>
    </linearGradient>
    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="260" rx="12" fill="url(#bgGradient)"/>
  
  <!-- Subtle Industrial Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="850" y2="40"/>
    <line x1="0" y1="90" x2="850" y2="90"/>
    <line x1="0" y1="140" x2="850" y2="140"/>
    <line x1="0" y1="190" x2="850" y2="190"/>
    <line x1="0" y1="240" x2="850" y2="240"/>
    <line x1="85" y1="0" x2="85" y2="260"/>
    <line x1="170" y1="0" x2="170" y2="260"/>
    <line x1="255" y1="0" x2="255" y2="260"/>
    <line x1="340" y1="0" x2="340" y2="260"/>
    <line x1="425" y1="0" x2="425" y2="260"/>
    <line x1="510" y1="0" x2="510" y2="260"/>
    <line x1="595" y1="0" x2="595" y2="260"/>
    <line x1="680" y1="0" x2="680" y2="260"/>
    <line x1="765" y1="0" x2="765" y2="260"/>
  </g>

  <!-- Industrial Border / Rivet Accents -->
  <rect x="12" y="12" width="826" height="236" rx="8" fill="none" stroke="#CD412B" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="24" cy="24" r="3" fill="#444a52"/>
  <circle cx="826" cy="24" r="3" fill="#444a52"/>
  <circle cx="24" cy="236" r="3" fill="#444a52"/>
  <circle cx="826" cy="236" r="3" fill="#444a52"/>

  <!-- Top Hazard Bar Accent -->
  <g transform="translate(12, 12)">
    <rect width="180" height="6" fill="#CD412B"/>
    <rect x="190" width="20" height="6" fill="#E67E22"/>
    <rect x="220" width="10" height="6" fill="#CD412B"/>
  </g>

  <!-- Stylized Rust Logo Emblem (Iconic Rust Symbol: Cog/Shield with cutouts) -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Base Icon Plate -->
    <rect x="0" y="0" width="170" height="170" rx="14" fill="url(#metalPlate)" stroke="#CD412B" stroke-width="3"/>
    
    <!-- Stylized Rust Radiation / Cog Glyph -->
    <g transform="translate(85, 85)">
      <!-- Outer segmented ring -->
      <circle r="60" fill="none" stroke="#CD412B" stroke-width="8" stroke-dasharray="24 10" opacity="0.9"/>
      <!-- Inner Core Hazard Symbol -->
      <path d="M -32,-32 L 32,-32 L 0,28 Z" fill="url(#rustGradient)" />
      <circle r="22" fill="#1a1c20"/>
      <circle r="14" fill="#CD412B"/>
      <!-- Hazard Marks -->
      <line x1="-48" y1="0" x2="-26" y2="0" stroke="#CD412B" stroke-width="5" stroke-linecap="round"/>
      <line x1="26" y1="0" x2="48" y2="0" stroke="#CD412B" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="-48" x2="0" y2="-26" stroke="#CD412B" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="26" x2="0" y2="48" stroke="#CD412B" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Corner bolts on emblem -->
    <circle cx="12" cy="12" r="3.5" fill="#CD412B"/>
    <circle cx="158" cy="12" r="3.5" fill="#CD412B"/>
    <circle cx="12" cy="158" r="3.5" fill="#CD412B"/>
    <circle cx="158" cy="158" r="3.5" fill="#CD412B"/>
  </g>

  <!-- Typography Section -->
  <!-- "RUST" Title -->
  <g transform="translate(265, 130)" filter="url(#shadow)">
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" letter-spacing="8" fill="url(#rustGradient)">RUST</text>
    <!-- Top Highlights on Text -->
    <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" letter-spacing="8" fill="none" stroke="#FFA07A" stroke-width="1.5" opacity="0.4">RUST</text>
  </g>

  <!-- Subtitle Tagline & Badges -->
  <g transform="translate(268, 172)">
    <text font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#D1D5DB">SURVIVAL • PVP • DEDICATED SERVER</text>
  </g>

  <!-- Badges / Tags below -->
  <g transform="translate(268, 195)">
    <!-- Badge 1: Facepunch Studios -->
    <rect x="0" y="0" width="135" height="24" rx="4" fill="#20242a" stroke="#374151" stroke-width="1"/>
    <text x="12" y="16" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">FACEPUNCH STUDIOS</text>

    <!-- Badge 2: Steam App ID -->
    <g transform="translate(145, 0)">
      <rect x="0" y="0" width="105" height="24" rx="4" fill="#20242a" stroke="#374151" stroke-width="1"/>
      <text x="10" y="16" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CD412B">APPID: 252490</text>
    </g>

    <!-- Badge 3: Multiplayer Survival -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="130" height="24" rx="4" fill="#20242a" stroke="#374151" stroke-width="1"/>
      <text x="10" y="16" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#10B981">● MULTIPLAYER</text>
    </g>
  </g>

  <!-- Right Decorative Industrial Elements -->
  <g transform="translate(730, 60)" opacity="0.3">
    <!-- Hazard diagonal stripes -->
    <line x1="0" y1="0" x2="30" y2="30" stroke="#CD412B" stroke-width="6"/>
    <line x1="15" y1="0" x2="45" y2="30" stroke="#CD412B" stroke-width="6"/>
    <line x1="30" y1="0" x2="60" y2="30" stroke="#CD412B" stroke-width="6"/>
    <line x1="45" y1="0" x2="75" y2="30" stroke="#CD412B" stroke-width="6"/>
  </g>

  <!-- Subtle bottom right coordinates / technical vibe -->
  <text x="820" y="235" font-family="monospace" font-size="10" fill="#4B5563" text-anchor="end">LOC: 52°13'N / SURVIVE_OR_DIE</text>
</svg>